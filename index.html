<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="트레이딩 메모">
<meta name="theme-color" content="#111111">
<title>트레이딩 메모</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeece8;
  --text:#111111;--text2:#777770;--text3:#aaa;
  --border:#e0ddd8;--border2:#ccc;
  --green:#1D9E75;--green-bg:#EAF3DE;--green-text:#3B6D11;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --radius:14px;--radius-sm:10px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
    --text:#f0f0ee;--text2:#909088;--text3:#555;
    --border:#333;--border2:#444;
    --green-bg:#0a2e1a;--green-text:#6ECA9F;
    --red-bg:#2e0f0f;--red-text:#F09595;
    --blue-bg:#0a1e35;--blue-text:#85B7EB;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto}
.topbar{padding:env(safe-area-inset-top) 0 0;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.topbar-title{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.topbar-sub{font-size:12px;color:var(--text2)}
.tabs{display:flex;padding:0 6px}
.tab{flex:1;padding:10px 0 8px;font-size:13px;font-weight:500;text-align:center;cursor:pointer;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent;transition:all 0.2s}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.content{padding:16px 16px calc(env(safe-area-inset-bottom)+80px)}

.scan-area{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:20px 16px;text-align:center;cursor:pointer;background:var(--bg2);margin-bottom:14px;position:relative}
.scan-area:active{background:var(--bg3)}
.scan-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:16px}
.scan-icon{font-size:28px;margin-bottom:6px}
.scan-label{font-size:14px;font-weight:500;margin-bottom:3px}
.scan-sub{font-size:12px;color:var(--text2);line-height:1.4}
.img-prev{width:100%;border-radius:var(--radius-sm);max-height:150px;object-fit:cover;margin-bottom:12px;display:none}

.analyzing{display:none;text-align:center;padding:16px;background:var(--bg2);border-radius:var(--radius);margin-bottom:12px}
.spin{display:inline-block;width:20px;height:20px;border:2.5px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing-txt{font-size:13px;color:var(--text2)}
.analyzing-detail{font-size:11px;color:var(--text3);margin-top:3px}

/* 종목 선택 배너 */
.pick-banner{display:none;border-radius:var(--radius);margin-bottom:14px;overflow:hidden;border:1px solid var(--border)}
.pick-header{background:var(--bg2);padding:10px 14px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}
.pick-list{padding:8px}
.pick-btn{display:block;width:100%;text-align:left;padding:12px 13px;margin-bottom:6px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);cursor:pointer;font-family:inherit;transition:background 0.1s}
.pick-btn:last-child{margin-bottom:0}
.pick-btn:active{background:var(--bg3)}
.pb-name{font-size:14px;font-weight:600;color:var(--text);display:block;margin-bottom:4px}
.pb-meta{display:flex;gap:10px;flex-wrap:wrap}
.pb-tag{font-size:12px;color:var(--text2)}
.pb-tag b{color:var(--text)}

/* 인식 성공 배너 */
.ok-banner{display:none;background:var(--green-bg);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;border-left:3px solid var(--green);font-size:13px;color:var(--green-text);font-weight:500}

.section{background:var(--bg2);border-radius:var(--radius);padding:14px 14px 6px;margin-bottom:12px}
.section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none}
.field input:focus{outline:2px solid rgba(128,128,128,0.2);outline-offset:-1px}
.field input[readonly]{background:var(--bg3);color:var(--text2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.pct{font-size:11px;font-weight:600;padding:2px 7px;border-radius:12px}
.pct-up{background:var(--green-bg);color:var(--green-text)}
.pct-dn{background:var(--red-bg);color:var(--red-text)}

.preview{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;font-size:12px;font-family:'Menlo','Courier New',monospace;line-height:2;color:var(--text2);margin-bottom:14px;white-space:pre-wrap}

.btn-save{width:100%;padding:15px;border-radius:var(--radius);background:var(--text);color:var(--bg);font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit;margin-bottom:8px}
.btn-save:active{opacity:0.7}
.btn-clear{width:100%;padding:12px;border-radius:var(--radius);background:transparent;border:1px solid var(--border);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit}
.notice{text-align:center;font-size:13px;color:var(--green);padding:8px 0;min-height:22px;font-weight:500}
.notice.err{color:var(--red-text)}

/* 목록 */
.memo-list{display:flex;flex-direction:column;gap:12px}
.memo-card{background:var(--bg2);border-radius:var(--radius);padding:16px;cursor:pointer;border:1px solid var(--border)}
.memo-card:active{background:var(--bg3)}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.mc-name{font-size:19px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
.mc-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.mc-date{font-size:13px;font-weight:500;color:var(--text2)}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.b-on{background:var(--blue-bg);color:var(--blue-text)}
.b-off{background:var(--bg3);color:var(--text2)}
.mc-meta{display:flex;flex-wrap:wrap;gap:8px 0;flex-direction:column;margin-top:2px}
.mc-meta-row{display:flex;gap:16px;font-size:14px;color:var(--text2)}
.mc-meta-row .lbl{font-size:12px;color:var(--text3);margin-right:3px}
.mc-meta-row .val{color:var(--text);font-weight:600}
.mc-meta-row .val-up{color:var(--green-text);font-weight:700;font-size:15px}
.mc-meta-row .val-dn{color:var(--red-text);font-weight:700;font-size:15px}
.mc-divider{height:1px;background:var(--border);margin:10px 0}
.mc-memo-txt{font-size:13px;color:var(--text2);line-height:1.5}
.empty{text-align:center;padding:60px 0;color:var(--text2);font-size:14px;line-height:2}


.detail{background:var(--bg2);border-radius:var(--radius);padding:18px;margin-bottom:12px;border:1px solid var(--border2)}
.d-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.d-name{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.close-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.d-rows{background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.d-row{display:flex;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--border)}
.d-row:last-child{border-bottom:none}
.d-lbl{font-size:13px;color:var(--text2);width:72px;flex-shrink:0}
.d-val{font-size:16px;font-weight:600;color:var(--text);flex:1}
.d-val.up{color:var(--green-text);font-size:17px}
.d-val.dn{color:var(--red-text);font-size:17px}
.d-sub{font-size:12px;color:var(--text2);margin-left:6px;font-weight:400}
.act-row{display:flex;gap:8px;margin-bottom:10px}
.act-btn{flex:1;padding:13px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-family:inherit}
.act-del{color:var(--red-text);border-color:var(--red-bg)}
.act-edit{background:var(--text);color:var(--bg);border-color:var(--text)}
/* 매도 섹션 */
.sell-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.sell-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px}
.sell-row{display:flex;gap:10px;margin-bottom:10px}
.sell-field{flex:1}
.sell-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.sell-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none}
.sell-field input:focus{outline:2px solid rgba(128,128,128,0.2);outline-offset:-1px}
.profit-box{border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;text-align:center}
.profit-box.pos{background:var(--green-bg);border:1px solid var(--green)}
.profit-box.neg{background:var(--red-bg);border:1px solid var(--red)}
.profit-rate{font-size:24px;font-weight:800;letter-spacing:-0.5px}
.profit-rate.pos{color:var(--green-text)}
.profit-rate.neg{color:var(--red-text)}
.profit-detail{font-size:13px;margin-top:4px}
.profit-detail.pos{color:var(--green-text)}
.profit-detail.neg{color:var(--red-text)}
.손절-badge{display:inline-block;background:var(--red-text);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.btn-sell-confirm{width:100%;padding:12px;border-radius:var(--radius-sm);background:var(--text);color:var(--bg);font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
/* 수정 폼 */
.edit-section{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.edit-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px}
.edit-field{margin-bottom:10px}
.edit-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.edit-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none}
.edit-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-acts{display:flex;gap:8px}
.edit-save{flex:2;padding:12px;border-radius:var(--radius-sm);background:var(--text);color:var(--bg);font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.edit-cancel{flex:1;padding:12px;border-radius:var(--radius-sm);background:transparent;color:var(--text2);font-size:14px;border:1px solid var(--border);cursor:pointer;font-family:inherit}

.pick-check-item{border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);margin-bottom:8px;overflow:hidden;transition:border-color 0.15s}
.pick-check-item.selected{border-color:var(--blue);background:var(--blue-bg)}
.pick-check-item.saved{border-color:var(--green);background:var(--green-bg);opacity:0.7}
.pci-top{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;cursor:pointer}
.pci-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:13px}
.pick-check-item.selected .pci-check{background:var(--blue);border-color:var(--blue);color:#fff}
.pick-check-item.saved .pci-check{background:var(--green);border-color:var(--green);color:#fff}
.pci-info{flex:1;min-width:0}
.pci-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.pci-meta{font-size:12px;color:var(--text2)}
.pci-fill-btn{width:100%;padding:9px;border:none;border-top:1px solid var(--border);background:var(--blue-bg);color:var(--blue-text);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.pick-actions{display:flex;gap:8px;padding:8px;border-top:1px solid var(--border);background:var(--bg2)}
.pick-act-btn{flex:1;padding:10px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.pick-act-btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.twin-input{display:flex;align-items:center;gap:8px}
.ti-group{flex:1;position:relative}
.ti-group input{width:100%;padding:11px 30px 11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none}
.ti-group input:focus{outline:2px solid rgba(128,128,128,0.2);outline-offset:-1px}
.ti-unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text2);pointer-events:none;font-weight:500}
.ti-div{font-size:18px;color:var(--text3);flex-shrink:0;line-height:1}
.install-hint{background:var(--blue-bg);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.ih-title{font-size:13px;font-weight:600;color:var(--blue-text);margin-bottom:5px}
.ih-body{font-size:12px;color:var(--text2);line-height:1.6}
.ih-close{float:right;background:none;border:none;cursor:pointer;color:var(--text2);font-size:14px;padding:0;margin:-2px -2px 0 6px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-title">📊 트레이딩 메모</div>
      <div class="topbar-sub" id="count-badge"></div>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="sw('new')">새 기록</button>
      <button class="tab" onclick="sw('list')">목록</button>
    </div>
  </div>

  <div class="scroll">
    <div id="pane-new" class="content">

      <div id="install-hint" class="install-hint" style="display:none">
        <button class="ih-close" onclick="document.getElementById('install-hint').style.display='none'">✕</button>
        <div class="ih-title">📲 홈 화면에 추가하기</div>
        <div class="ih-body" id="install-hint-body"></div>
      </div>

      <div id="first-time-banner" style="display:none;background:var(--blue-bg);border-radius:var(--radius);padding:13px 14px;margin-bottom:12px;border-left:3px solid var(--blue)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="font-size:13px;font-weight:600;color:var(--blue-text);margin-bottom:5px">📥 최초 1회 설정 필요</div>
          <button onclick="document.getElementById('first-time-banner').style.display='none';localStorage.setItem('ocr_hint_dismissed','1')" style="background:none;border:none;cursor:pointer;color:var(--text2);font-size:14px;padding:0">✕</button>
        </div>
        <div style="font-size:12px;color:var(--text2);line-height:1.6">
          OCR 한글 인식 데이터 (약 7MB)를<br>
          <b>Wi-Fi 연결 상태</b>에서 처음 한 번 다운로드합니다.<br>
          이후에는 <b>인터넷 없이 완전 오프라인</b>으로 동작해요.
        </div>
      </div>

      <div class="scan-area">
        <input type="file" accept="image/*" id="file-input" onchange="onImg(this)">
        <div class="scan-icon">📷</div>
        <div class="scan-label">MTS 화면 촬영 / 스크린샷 선택</div>
        <div class="scan-sub">삼성증권 매매내역 또는 시세 화면</div>
      </div>

      <img id="img-preview" class="img-prev">

      <div class="analyzing" id="analyzing">
        <div class="spin"></div>
        <div class="analyzing-txt" id="analyzing-txt">화면 인식 중...</div>
        <div class="analyzing-detail" id="analyzing-detail">최초 1회 인터넷 필요 — 이후 오프라인 가능</div>
      </div>

      <!-- 여러 종목 선택 -->
      <div class="pick-banner" id="pick-banner">
        <div class="pick-header">📋 종목을 선택하세요 — 이름이 다르면 직접 수정하세요</div>
        <div class="pick-list" id="pick-list"></div>
      </div>

      <!-- 단일 인식 성공 -->
      <div class="ok-banner" id="ok-banner"></div>

      <!-- OCR 에러 (persistent) -->
      <div id="ocr-error" style="display:none;background:var(--red-bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;border-left:3px solid var(--red);font-size:13px;color:var(--red-text);line-height:1.6"></div>

      <!-- OCR 원문 디버그 -->
      <div id="ocr-debug" style="display:none;background:var(--bg3);border-radius:var(--radius-sm);padding:10px;font-size:10px;font-family:monospace;color:var(--text3);margin-bottom:10px;max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-all"></div>

      <div class="section">
        <div class="section-title">매수 정보</div>
        <div class="field">
          <label>매수날짜</label>
          <input id="f-date" type="date" oninput="upPrev()">
        </div>
        <div class="field">
          <label>종목명</label>
          <input id="f-name" type="text" placeholder="예: TIGER 200 금융" oninput="upPrev()" autocomplete="off">
        </div>
        <div class="row2">
          <div class="field">
            <label>매수가</label>
            <input id="f-buy" type="text" inputmode="numeric" placeholder="0" oninput="onBuyInput()">
          </div>
          <div class="field">
            <label>수량</label>
            <input id="f-qty" type="text" inputmode="numeric" placeholder="0" oninput="onQtyInput()">
          </div>
        </div>
        <div class="field">
          <label>매수총액</label>
          <input id="f-total" type="text" readonly placeholder="매수가 × 수량">
        </div>
      </div>

      <div class="section">
        <div class="section-title">목표가 / 손절가 / 보유기한</div>
        <div class="field">
          <label>목표가</label>
          <div class="twin-input">
            <div class="ti-group">
              <input id="f-target-pct" type="text" inputmode="decimal" placeholder="+0.0" oninput="syncPrice('target','pct')">
              <span class="ti-unit">%</span>
            </div>
            <span class="ti-div">↔</span>
            <div class="ti-group">
              <input id="f-target-amt" type="text" inputmode="numeric" placeholder="금액" oninput="syncPrice('target','amt')">
              <span class="ti-unit">원</span>
            </div>
          </div>
        </div>
        <div class="field">
          <label>손절가</label>
          <div class="twin-input">
            <div class="ti-group">
              <input id="f-stop-pct" type="text" inputmode="decimal" placeholder="-0.0" onfocus="if(!this.value)this.value='-'" oninput="syncPrice('stop','pct')">
              <span class="ti-unit">%</span>
            </div>
            <span class="ti-div">↔</span>
            <div class="ti-group">
              <input id="f-stop-amt" type="text" inputmode="numeric" placeholder="금액" oninput="syncPrice('stop','amt')">
              <span class="ti-unit">원</span>
            </div>
          </div>
        </div>
        <div class="field">
          <label>보유기한 (일)</label>
          <input id="f-days" type="number" inputmode="numeric" placeholder="예: 5" oninput="upPrev()">
        </div>
      </div>

      <div class="field">
        <label>메모</label>

</script>
<script>
// ── Storage ─────────────────────────────────────────────
let memos=[];
const DB='trading_memos_v3';
function load(){
  try{const d=localStorage.getItem(DB);if(d)memos=JSON.parse(d);}catch(e){memos=[];}
  renderList();updateBadge();showInstallHint();
  if(!localStorage.getItem('ocr_ready') && !localStorage.getItem('ocr_hint_dismissed')){
    document.getElementById('first-time-banner').style.display='block';
  }
}
function persist(){try{localStorage.setItem(DB,JSON.stringify(memos));}catch(e){}}

function sw(p){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',(i===0&&p==='new')||(i===1&&p==='list')));
  document.getElementById('pane-new').style.display=p==='new'?'block':'none';
  document.getElementById('pane-list').style.display=p==='list'?'block':'none';
  if(p==='list')renderList();
}

// ── 계산 헬퍼 ───────────────────────────────────────────
function pct(b,p){if(!b||!p||b==0)return null;return((p-b)/b*100).toFixed(1);}
function fmt(n){return(n||n===0)?Number(n).toLocaleString('ko-KR'):'—';}

function numVal(id){
  var v=document.getElementById(id).value.replace(/,/g,'');
  return parseFloat(v)||0;
}
function fmtInput(id){
  var el=document.getElementById(id);
  var raw=el.value.replace(/,/g,'').replace(/[^0-9]/g,'');
  if(raw)el.value=parseInt(raw).toLocaleString('ko-KR');
  else el.value='';
}
function onBuyInput(){
  fmtInput('f-buy');
  // 매수가 변경 시 금액으로 입력된 목표/손절 % 재계산
  if(document.getElementById('f-target-amt').value) syncPrice('target','amt');
  if(document.getElementById('f-stop-amt').value)   syncPrice('stop','amt');
  upPrev();
}
function onQtyInput(){
  fmtInput('f-qty');
  upPrev();
}
function syncPrice(field,from){
  var buy=numVal('f-buy');
  if(!buy)return;
  var pctEl=document.getElementById('f-'+field+'-pct');
  var amtEl=document.getElementById('f-'+field+'-amt');
  if(from==='pct'){
    var raw=pctEl.value;
    // 손절가: 숫자만 입력 시 자동으로 음수 처리
    if(field==='stop'&&raw&&raw!=='-'&&parseFloat(raw)>0) raw='-'+raw;
    var p=parseFloat(raw);
    if(!isNaN(p)){
      var amt=Math.round(buy*(1+p/100));
      amtEl.value=amt>0?amt.toLocaleString('ko-KR'):'';
    }else{amtEl.value='';}
  }else{
    fmtInput('f-'+field+'-amt');
    var a=numVal('f-'+field+'-amt');
    if(a>0){
      var pp=((a-buy)/buy*100).toFixed(2);
      // 손절가는 매수가보다 낮을 것이므로 pp가 음수면 그대로
      pctEl.value=(parseFloat(pp)>0?'+':'')+pp;
    }else{pctEl.value=field==='stop'?'-':'';}
  }
  upPrev();
}
function upPrev(){
  var nm=document.getElementById('f-name').value;
  var b=numVal('f-buy');
  var qty=numVal('f-qty');
  var t=numVal('f-target-amt');
  var s=numVal('f-stop-amt');
  var d=document.getElementById('f-days').value;
  var dt=document.getElementById('f-date').value;
  var total=b&&qty?b*qty:0;

  document.getElementById('f-total').value=total?total.toLocaleString('ko-KR')+'원':'';

  var pt=b&&t?pct(b,t):null;
  var ps=b&&s?pct(b,s):null;

  document.getElementById('prev').textContent=
'매수날짜:  '+(dt||'—')+
'\n종목명:    '+(nm||'—')+
'\n매수가:    '+(b?fmt(b):'—')+
'\n수량:      '+(qty?fmt(qty)+'주':'—')+
'\n매수총액:  '+(total?fmt(total)+'원':'—')+
'\n목표가:    '+(t?fmt(t)+' ('+(pt>0?'+':'')+pt+'%)':'—')+'  → 도달 시 즉시 매도'+
'\n손절가:    '+(s?fmt(s)+' ('+(ps||'')+'%)':'—')+'  → 도달 시 즉시 매도'+
'\n보유기한:  '+(d||'—')+' 일  → 위 둘 다 미달 시 매도';
}

// ── OCR ─────────────────────────────────────────────────
async function onImg(inp){
  if(!inp.files||!inp.files[0])return;
  const file=inp.files[0];
  const imgEl=document.getElementById('img-preview');
  imgEl.src=URL.createObjectURL(file);
  imgEl.style.display='block';
  setAnalyzing(true,'화면 인식 중...','OCR 엔진 로딩 중 (최초 1회만 약 10초)');
  document.getElementById('pick-banner').style.display='none';
  document.getElementById('ok-banner').style.display='none';
  document.getElementById('ocr-error').style.display='none';
  document.getElementById('ocr-debug').style.display='none';
  try{
    const result=await Tesseract.recognize(file,'kor',{
      logger:m=>{
        if(m.status==='loading language traineddata')
          setAnalyzing(true,'언어 데이터 다운로드 중...','처음 한 번만 — Wi-Fi 권장');
        else if(m.status==='initializing api')
          setAnalyzing(true,'OCR 초기화 중...','잠시만 기다려주세요');
        else if(m.status==='recognizing text')
          setAnalyzing(true,'화면 인식 중...','분석 중... '+Math.round((m.progress||0)*100)+'%');
      }
    });
    setAnalyzing(false);
    localStorage.setItem('ocr_ready','1');
    document.getElementById('first-time-banner').style.display='none';
    const rawText = result.data.text||'';
    // 디버그: raw OCR 텍스트 표시
    const dbg = document.getElementById('ocr-debug');
    dbg.textContent = '[ OCR 원문 ]\n' + rawText;
    dbg.style.display = 'block';
    if(!rawText.trim()){
      showError('OCR 인식 결과가 없습니다.\n스크린샷이 선명한지 확인해주세요.');
      return;
    }
    const parsed=parseSamsungMTS(rawText);
    if(parsed.type==='none'){
      showError('종목 정보를 찾지 못했습니다.\n아래 OCR 원문을 확인해보세요.');
      return;
    }
    showParsed(parsed);
  }catch(e){
    setAnalyzing(false);
    var msg = e && e.message ? e.message : (e ? String(e) : '알 수 없는 오류');
    showError('OCR 오류: '+msg+'\n\n가능한 원인:\n• 인터넷 연결 필요 (최초 1회)\n• Worker 스크립트 로딩 실패');
    console.error(e);
  }
}
function setAnalyzing(on,txt,detail){
  document.getElementById('analyzing').style.display=on?'block':'none';
  if(txt)document.getElementById('analyzing-txt').textContent=txt;
  if(detail)document.getElementById('analyzing-detail').textContent=detail;
}

// ── 삼성증권 파싱 (개선) ─────────────────────────────────
function parseSamsungMTS(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const isTradingHistory=lines.some(l=>/(매매내역|체결내역|체결단가|현금매수|신용매수|KOSDAQ매수|KOSDAQ매도|매수|매도)/.test(l));
  return isTradingHistory ? parseTradingHistory(lines) : parseStockDetail(lines);
}

function cleanName(n){
  if(!n)return n;
  // OCR 앞 숫자 노이즈 제거 ("1668 시반도체" → "시반도체")
  n=n.replace(/^\d{1,6}\s+/,'');
  n=n.replace(/^[^가-힣A-Za-z0-9]+/,'').trim();
  return n;
}

function parseTradingHistory(lines){
  const stocks=[];
  const SKIP=/매매일|대출일|종목명|주문구분|체결수량|체결단가|기간|상세보기|체결내역|매매내역|매수체결|매도체결|종합|비대면|투잡/;

  for(let i=0;i<lines.length;i++){
    const line=lines[i];

    // ① 날짜가 있는 줄만 기준점으로 사용
    const dateM=line.match(/(\d{4}-\d{2}-\d{2})/);
    if(!dateM)continue;
    if(line.indexOf('~')!==-1)continue; // 기간 범위 줄 제외 ("~ 2026-06-03")

    const date=dateM[1];
    let name=null, qty=null, price=null;

    // ② 날짜 줄에서 종목명+수량 추출 ("2026-06-01  TIGER 200 금융  18")
    const sameLine=line.replace(date,'').trim();
    const slm=sameLine.match(/^(.+?)\s+(\d{1,5})\s*$/);
    if(slm){
      const cand=cleanName(slm[1]);
      if(cand&&cand.length>=2&&/[가-힣A-Za-z]/.test(cand)&&!SKIP.test(cand)){
        name=cand; qty=slm[2];
      }
    }

    // ③ 날짜만 단독으로 있는 줄이면 → 바로 다음 1~3줄에서 종목명 탐색
    if(!name){
      for(let k=i+1;k<Math.min(i+4,lines.length);k++){
        const nl=lines[k];
        if(/\d{4}-\d{2}-\d{2}/.test(nl))break; // 다음 날짜 만나면 중단
        if(/매수|매도/.test(nl))break;
        if(SKIP.test(nl)||/^[-~\s]+$/.test(nl))continue;
        // 종목명+수량
        const nm=nl.match(/^(.+?)\s+(\d{1,5})\s*$/);
        if(nm){
          const cand=cleanName(nm[1]);
          if(cand&&cand.length>=2&&/[가-힣A-Za-z]/.test(cand)){
            name=cand; qty=nm[2]; break;
          }
        }
        // 종목명만 (수량은 다음 줄)
        if(/[가-힣A-Za-z]/.test(nl)&&nl.length>=2&&nl.length<=40){
          const cand=cleanName(nl.trim());
          if(cand&&cand.length>=2&&!SKIP.test(cand)){name=cand;}
        }
      }
    }

    if(!name)continue; // 종목명 없으면 이 날짜 줄은 스킵

    // ④ 날짜 줄 이후 최대 6줄 안에서 매수/매도 가격 추출
    // 현금매수, 신용매수, KOSDAQ매수, 코스피매수 등 "매수"가 포함된 줄 모두 처리
    for(let j=i+1;j<Math.min(i+7,lines.length);j++){
      if(/매수|매도/.test(lines[j])){
        const nums=lines[j].match(/[\d,]{4,}/g);
        if(nums)price=nums[nums.length-1].replace(/,/g,'');
        break;
      }
    }

    if(price&&!stocks.find(s=>s.name===name))
      stocks.push({name,price,qty:qty||null,date});
  }

  return{type:stocks.length>0?'multi':'none',items:stocks};
}


function parseStockDetail(lines){
  let name=null,price=null,change=null;
  for(const l of lines){
    if(/(←|→|HOME|메뉴|설정|검색|관심|잔고|주문|차트|종료|설정)/.test(l))continue;
    if(/^\d/.test(l))continue;
    if(l.length>=2&&l.length<=20&&/[가-힣A-Za-z]/.test(l)){name=l;break;}
  }
  const priceMatches=lines.join(' ').match(/\d{1,3}(?:,\d{3})+/g)||[];
  if(priceMatches.length>0){
    const nums=priceMatches.map(p=>parseInt(p.replace(/,/g,'')));
    price=String(Math.max(...nums));
  }
  const chgM=lines.join(' ').match(/[▲▼+\-]?\s*\d+\.\d+%/);
  if(chgM)change=chgM[0].replace(/\s/g,'');
  return(name||price)?{type:'single',items:[{name,price,change}]}:{type:'none',items:[]};
}

// ── 결과 표시 ────────────────────────────────────────────
function showParsed(parsed){
  if(parsed.type==='none'||!parsed.items.length){
    showNotice('인식 결과가 없습니다. 직접 입력해주세요.','err');return;
  }
  if(parsed.type==='single'){
    fillForm(parsed.items[0]);
    document.getElementById('ok-banner').textContent='✓ 인식 완료 — 내용을 확인하고 저장하세요';
    document.getElementById('ok-banner').style.display='block';
  }
  if(parsed.type==='multi'){
    window._parsedItems=parsed.items;
    window._savedItems={};
    renderPickList();
    document.getElementById('pick-banner').style.display='block';
  }
}

function hidePick(){document.getElementById("pick-banner").style.display="none";}
function renderPickList(){
  var items=window._parsedItems||[];
  var saved=window._savedItems||{};
  var sel=window._selectedIdx;
  var html=items.map(function(item,idx){
    var p=Number(item.price)||0;
    var q=Number(item.qty)||0;
    var total=p&&q?p*q:0;
    var isSaved=saved[idx];
    var cls='pick-check-item'+(isSaved?' saved':'');
    var checkIcon=isSaved?'✓':'';
    return '<div class="'+cls+'" id="pci-'+idx+'">'
      +'<div class="pci-top" onclick="togglePick('+idx+')">'
      +'<div class="pci-check">'+checkIcon+'</div>'
      +'<div class="pci-info">'
      +'<div class="pci-name">'+(isSaved?'<s>':'')+item.name+(isSaved?'</s> ✓ 저장됨':'')+'</div>'
      +'<div class="pci-meta">'
      +(item.date?'📅 '+item.date+' &nbsp;':'')
      +'매수가 <b>'+fmt(p)+'원</b>'
      +(q?' &nbsp;수량 <b>'+fmt(q)+'주</b>':'')
      +(total?' &nbsp;총액 <b>'+fmt(total)+'원</b>':'')
      +'</div></div></div>'
      +(!isSaved?'<button class="pci-fill-btn" onclick="pickAndFill('+idx+')">↓ 이 종목으로 양식 채우기</button>':'')
      +'</div>';
  }).join('');
  html+='<div class="pick-actions">'
    +'<button class="pick-act-btn" onclick="hidePick()">닫기</button>'
    +'</div>';
  document.getElementById('pick-list').innerHTML=html;
}

function togglePick(idx){
  // 저장된 항목은 토글 불가
  if((window._savedItems||{})[idx])return;
  pickAndFill(idx);
}

function pickAndFill(idx){
  var item=(window._parsedItems||[])[idx];
  if(!item)return;
  fillForm(item);
  document.getElementById('ok-banner').textContent='↓ "'+item.name+'" 양식 채움 — 목표가/손절가 입력 후 저장하세요';
  document.getElementById('ok-banner').style.display='block';
  // 아래 폼으로 스크롤
  document.getElementById('f-name').scrollIntoView({behavior:'smooth',block:'center'});
}

function fillForm(item){
  if(item.name)document.getElementById('f-name').value=item.name;
  if(item.price){
    var p=String(item.price).replace(/[^0-9]/g,'');
    document.getElementById('f-buy').value=parseInt(p).toLocaleString('ko-KR');
  }
  if(item.qty){
    var q=String(item.qty).replace(/[^0-9]/g,'');
    document.getElementById('f-qty').value=parseInt(q).toLocaleString('ko-KR');
  }
  if(item.date)document.getElementById('f-date').value=item.date;
  upPrev();
}

// ── 저장/초기화 ──────────────────────────────────────────
function doSave(){
  const name=document.getElementById('f-name').value.trim();
  const buy=numVal('f-buy');
  if(!name||!buy){showNotice('종목명과 매수가는 필수입니다.','err');return;}
  const qty=numVal('f-qty')||null;
  const total=buy&&qty?buy*qty:null;
  memos.unshift({
    id:Date.now(),name,buy,qty,total,
    target:numVal('f-target-amt')||null,
    stop:numVal('f-stop-amt')||null,
    days:document.getElementById('f-days').value||null,
    memo:document.getElementById('f-memo').value.trim(),
    buyDate:document.getElementById('f-date').value||null,
    date:new Date().toLocaleDateString('ko-KR'),
    status:'active'
  });
  persist();updateBadge();
  // 픽 리스트에서 현재 채운 항목 저장됨 표시
  var items=window._parsedItems||[];
  var curName=name;
  items.forEach(function(item,idx){
    if(item.name===curName||(item.price&&item.price==buy)){
      if(!window._savedItems)window._savedItems={};
      window._savedItems[idx]=true;
    }
  });
  if(items.length>0) renderPickList();
  // 폼만 초기화 (픽 배너는 유지)
  clearFormOnly();
  showNotice('저장되었습니다! ✓');
}

function clearFormOnly(){
  ['f-name','f-buy','f-qty','f-target-pct','f-target-amt','f-stop-pct','f-stop-amt','f-days','f-memo'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-date').value='';
  document.getElementById('f-total').value='';
  document.getElementById('ok-banner').style.display='none';
  upPrev();
}
function clearF(){
  ['f-name','f-buy','f-qty','f-target-pct','f-target-amt','f-stop-pct','f-stop-amt','f-days','f-memo'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-date').value='';
  document.getElementById('f-total').value='';
  document.getElementById('img-preview').style.display='none';
  document.getElementById('pick-banner').style.display='none';
  document.getElementById('ok-banner').style.display='none';
  document.getElementById('ocr-error').style.display='none';
  document.getElementById('ocr-debug').style.display='none';
  document.getElementById('analyzing').style.display='none';

  document.getElementById('file-input').value='';
  upPrev();
}

function showError(msg){
  setAnalyzing(false);
  var el=document.getElementById('ocr-error');
  var closeBtn='<br><button onclick="document.getElementById(\"ocr-error\").style.display=\"none\"" style="margin-top:8px;padding:5px 14px;border-radius:8px;border:1px solid var(--red-text);background:none;color:var(--red-text);cursor:pointer;font-size:12px;font-family:inherit">닫기</button>';
  el.innerHTML=msg.replace(/\n/g,'<br>')+closeBtn;
  el.style.display='block';
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function showNotice(txt,type){
  const el=document.getElementById('notice');
  el.textContent=txt;el.className='notice'+(type?' '+type:'');
  setTimeout(()=>{el.textContent='';el.className='notice';},3500);
}
function updateBadge(){
  const n=memos.filter(m=>m.status==='active').length;
  document.getElementById('count-badge').textContent=n?`보유 ${n}종목`:'';
}

// ── 목록 ─────────────────────────────────────────────────
function renderList(){
  var la=document.getElementById('list-area');
  if(!memos.length){la.innerHTML='<div class="empty">📋 저장된 기록이 없습니다.<br>새 기록 탭에서 추가하세요.</div>';return;}
  la.innerHTML='<div class="memo-list">'+memos.map(function(m){
    var tp=m.target?pct(m.buy,m.target):null;
    var sp=m.stop?pct(m.buy,m.stop):null;
    var rows='';
    // 행1: 매수가 / 수량 / 총액
    var r1='<span><span class="lbl">매수가</span><span class="val">'+fmt(m.buy)+'원</span></span>';
    if(m.qty) r1+='<span><span class="lbl">수량</span><span class="val">'+fmt(m.qty)+'주</span></span>';
    if(m.total) r1+='<span><span class="lbl">총액</span><span class="val">'+fmt(m.total)+'원</span></span>';
    rows+='<div class="mc-meta-row">'+r1+'</div>';
    // 행2: 목표가 / 손절가
    var r2='';
    if(m.target) r2+='<span><span class="lbl">목표</span><span class="val-up">'+fmt(m.target)+'원 (+'+tp+'%)</span></span>';
    if(m.stop)   r2+='<span><span class="lbl">손절</span><span class="val-dn">'+fmt(m.stop)+'원 ('+sp+'%)</span></span>';
    if(r2) rows+='<div class="mc-meta-row">'+r2+'</div>';
    // 행3: 보유기한
    if(m.days) rows+='<div class="mc-meta-row"><span><span class="lbl">보유기한</span><span class="val">'+m.days+'일</span></span></div>';

    return '<div class="memo-card" onclick="showDetail('+m.id+')">'
      +'<div class="mc-top">'
      +'<div class="mc-name">'+m.name+'</div>'
      +'<div class="mc-right">'
      +'<span class="mc-date">'+( m.buyDate||m.date)+'</span>'
      +'<span class="badge '+(m.status==='active'?'b-on':'b-off')+'">'+(m.status==='active'?'보유중':'종료')+'</span>'
      +'</div></div>'
      +'<div class="mc-divider"></div>'
      +'<div class="mc-meta">'+rows+'</div>'
      +(m.memo?'<div class="mc-memo-txt" style="margin-top:10px">📝 '+m.memo+'</div>':'')
      +'</div>';
  }).join('')+'</div>';
}

function closeDetail(){document.getElementById("detail-area").innerHTML="";}

function detailRow(lbl,val,cls,sub){
  return '<div class="d-row">'
    +'<span class="d-lbl">'+lbl+'</span>'
    +'<span class="d-val'+(cls?' '+cls:'')+'">'+val
    +(sub?'<span class="d-sub">'+sub+'</span>':'')
    +'</span></div>';
}

function showDetail(id){
  var m=memos.find(function(m){return m.id===id;});if(!m)return;
  var tp=m.target?pct(m.buy,m.target):null;
  var sp=m.stop?pct(m.buy,m.stop):null;
  var da=document.getElementById('detail-area');

  var rows='';
  rows+=detailRow('매수날짜', m.buyDate||'—');
  rows+=detailRow('종목명', m.name);
  rows+=detailRow('매수가', fmt(m.buy)+'원');
  if(m.qty)   rows+=detailRow('수량', fmt(m.qty)+'주');
  if(m.total) rows+=detailRow('매수총액', fmt(m.total)+'원');
  if(m.target)rows+=detailRow('목표가', fmt(m.target)+'원','up','(+'+(tp)+'%)  → 도달 시 즉시 매도');
  if(m.stop)  rows+=detailRow('손절가', fmt(m.stop)+'원','dn','('+sp+'%)  → 도달 시 즉시 매도');
  if(m.days)  rows+=detailRow('보유기한', m.days+'일','','→ 횡보 손절');
  if(m.memo)  rows+=detailRow('메모', m.memo);

  // 매도 결과 (이미 입력된 경우)
  var sellResult='';
  if(m.sellPrice){
    var rateVal=((m.sellPrice-m.buy)/m.buy*100);
    var isLoss=rateVal<0;
    var rateStr=(rateVal>0?'+':'')+rateVal.toFixed(2)+'%';
    var profitAmt=(m.sellPrice-m.buy)*(m.qty||1);
    var cls2=isLoss?'neg':'pos';
    var sellTotal=m.sellTotal||(m.sellPrice*(m.qty||1));
    sellResult='<div class="profit-box '+cls2+'">'
      +'<div class="profit-rate '+cls2+'">'+rateStr
      +(isLoss?'<span class="손절-badge">손절</span>':'')+'</div>'
      +'<div class="profit-detail '+cls2+'">'
      +'매도총액 '+fmt(sellTotal)+'원'
      +' &nbsp;|&nbsp; 수익 '+(profitAmt>0?'+':'')+fmt(Math.round(profitAmt))+'원'
      +(m.sellDate?' &nbsp;|&nbsp; '+m.sellDate:'')
      +'</div></div>';
    rows+=detailRow('매도날짜', m.sellDate||'—');
    rows+=detailRow('매도가', fmt(m.sellPrice)+'원');
    rows+=detailRow('매도총액', fmt(sellTotal)+'원');
  }

  // 매도 입력 섹션 (미매도 상태)
  var sellInput='';
  if(!m.sellPrice){
    sellInput='<div class="sell-section">'
      +'<div class="sell-title">📤 매도 기록</div>'
      +'<div class="sell-row">'
      +'<div class="sell-field"><label>매도날짜</label>'
      +'<input type="date" id="si-date-'+id+'" value="'+(m.buyDate||'')+'"></div>'
      +'<div class="sell-field"><label>매도가</label>'
      +'<input type="text" inputmode="numeric" id="si-price-'+id+'" placeholder="0" oninput="onSellInput('+id+')"></div>'
      +'</div>'
      +'<div id="si-profit-'+id+'"></div>'
      +'<button class="btn-sell-confirm" onclick="confirmSell('+id+')">매도 확정</button>'
      +'</div>';
  }

  da.innerHTML='<div class="detail">'
    +'<div class="d-header"><span class="d-name">'+m.name+'</span>'
    +'<button class="close-x" onclick="closeDetail()">✕</button></div>'
    +sellResult
    +'<div class="d-rows">'+rows+'</div>'
    +sellInput
    +'<div class="act-row">'
    +'<button class="act-btn act-edit" onclick="editDetail('+id+')">수정</button>'
    +'<button class="act-btn" onclick="toggleStat('+id+')">'+(m.status==='active'?'종료 처리':'재개')+'</button>'
    +'<button class="act-btn act-del" onclick="delMemo('+id+')">삭제</button>'
    +'</div></div>';
  da.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function fmtEditInput(el){var r=el.value.replace(/,/g,"").replace(/[^0-9]/g,"");el.value=r?parseInt(r).toLocaleString("ko-KR"):"";};
function onSellInput(id){
  var m=memos.find(function(m){return m.id===id;});if(!m)return;
  var el=document.getElementById('si-price-'+id);
  // 콤마 포맷
  var raw=el.value.replace(/,/g,'').replace(/[^0-9]/g,'');
  if(raw)el.value=parseInt(raw).toLocaleString('ko-KR');
  var sellP=parseInt(raw)||0;
  var box=document.getElementById('si-profit-'+id);
  if(!sellP||!m.buy){box.innerHTML='';return;}
  var rate=(sellP-m.buy)/m.buy*100;
  var isLoss=rate<0;
  var cls=isLoss?'neg':'pos';
  var rateStr=(rate>0?'+':'')+rate.toFixed(2)+'%';
  var profitAmt=(sellP-m.buy)*(m.qty||1);
  var sellTotal=sellP*(m.qty||1);
  box.innerHTML='<div class="profit-box '+cls+'" style="margin-bottom:12px">'
    +'<div class="profit-rate '+cls+'">'+rateStr
    +(isLoss?'<span class="손절-badge">손절</span>':'')+'</div>'
    +'<div class="profit-detail '+cls+'">'
    +'매도총액 '+fmt(sellTotal)+'원'
    +' &nbsp;|&nbsp; 수익 '+(profitAmt>0?'+':'')+fmt(Math.round(profitAmt))+'원'
    +'</div></div>';
}

function confirmSell(id){
  var m=memos.find(function(m){return m.id===id;});if(!m)return;
  var priceEl=document.getElementById('si-price-'+id);
  var dateEl=document.getElementById('si-date-'+id);
  var raw=priceEl.value.replace(/,/g,'');
  var sellP=parseInt(raw)||0;
  if(!sellP){alert('매도가를 입력해주세요.');return;}
  m.sellPrice=sellP;
  m.sellTotal=sellP*(m.qty||1);
  m.sellDate=dateEl?dateEl.value:'';
  m.status='closed';
  persist();updateBadge();renderList();showDetail(id);
}

function editDetail(id){
  var m=memos.find(function(m){return m.id===id;});if(!m)return;
  var da=document.getElementById('detail-area');
  da.innerHTML='<div class="detail">'
    +'<div class="d-header"><span class="d-name">수정</span>'
    +'<button class="close-x" onclick="showDetail('+id+')">✕</button></div>'

    // ── 매수 정보 ──
    +'<div class="edit-section">'
    +'<div class="edit-title">📥 매수 정보</div>'
    +'<div class="edit-field"><label>종목명</label>'
    +'<input id="ef-name" type="text" value="'+m.name+'"></div>'
    +'<div class="edit-row2">'
    +'<div class="edit-field"><label>매수날짜</label>'
    +'<input id="ef-date" type="date" value="'+(m.buyDate||'')+'"></div>'
    +'<div class="edit-field"><label>매수가</label>'
    +'<input id="ef-buy" type="text" inputmode="numeric" value="'+fmt(m.buy)+'" oninput="fmtEditInput(this)"></div>'
    +'</div>'
    +'<div class="edit-row2">'
    +'<div class="edit-field"><label>수량</label>'
    +'<input id="ef-qty" type="text" inputmode="numeric" value="'+(m.qty?fmt(m.qty):'')+'" oninput="fmtEditInput(this)"></div>'
    +'<div class="edit-field"><label>보유기한(일)</label>'
    +'<input id="ef-days" type="number" value="'+(m.days||'')+'"></div>'
    +'</div>'
    +'<div class="edit-row2">'
    +'<div class="edit-field"><label>목표가</label>'
    +'<input id="ef-target" type="text" inputmode="numeric" value="'+(m.target?fmt(m.target):'')+'" oninput="fmtEditInput(this)"></div>'
    +'<div class="edit-field"><label>손절가</label>'
    +'<input id="ef-stop" type="text" inputmode="numeric" value="'+(m.stop?fmt(m.stop):'')+'" oninput="fmtEditInput(this)"></div>'
    +'</div>'
    +'<div class="edit-field"><label>메모</label>'
    +'<input id="ef-memo" type="text" value="'+(m.memo||'')+'"></div>'
    +'</div>'

    // ── 매도 정보 ──
    +'<div class="edit-section" style="margin-top:10px">'
    +'<div class="edit-title">📤 매도 정보</div>'
    +'<div class="edit-row2">'
    +'<div class="edit-field"><label>매도날짜</label>'
    +'<input id="ef-selldate" type="date" value="'+(m.sellDate||'')+'"></div>'
    +'<div class="edit-field"><label>매도가</label>'
    +'<input id="ef-sellprice" type="text" inputmode="numeric" value="'+(m.sellPrice?fmt(m.sellPrice):'')+'" oninput="fmtEditInput(this);updateEditSellCalc('+id+')"></div>'
    +'</div>'
    +'<div id="ef-sell-calc"></div>'
    +'</div>'

    +'<div class="edit-acts">'
    +'<button class="edit-save" onclick="saveEdit('+id+')">저장</button>'
    +'<button class="edit-cancel" onclick="showDetail('+id+')">취소</button>'
    +'</div></div>';

  // 매도가 이미 있으면 수익 미리 표시
  if(m.sellPrice) updateEditSellCalc(id);
  da.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function updateEditSellCalc(id){
  var m=memos.find(function(m){return m.id===id;});if(!m)return;
  var el=document.getElementById('ef-sellprice');
  var box=document.getElementById('ef-sell-calc');
  if(!el||!box)return;
  var sellP=parseInt(el.value.replace(/,/g,''))||0;
  if(!sellP||!m.buy){box.innerHTML='';return;}
  var rate=(sellP-m.buy)/m.buy*100;
  var isLoss=rate<0;
  var cls=isLoss?'neg':'pos';
  var sellTotal=sellP*(m.qty||1);
  var profitAmt=(sellP-m.buy)*(m.qty||1);
  box.innerHTML='<div class="profit-box '+cls+'" style="margin:8px 0 4px">'
    +'<div class="profit-rate '+cls+'">'+(rate>0?'+':'')+rate.toFixed(2)+'%'
    +(isLoss?'<span class="손절-badge">손절</span>':'')+'</div>'
    +'<div class="profit-detail '+cls+'">'
    +'매도총액 '+fmt(sellTotal)+'원 &nbsp;|&nbsp; 수익 '+(profitAmt>0?'+':'')+fmt(Math.round(profitAmt))+'원'
    +'</div></div>';
}

function saveEdit(id){
  var m=memos.find(function(m){return m.id===id;});if(!m)return;
  m.name=document.getElementById('ef-name').value.trim()||m.name;
  m.buyDate=document.getElementById('ef-date').value||m.buyDate;
  m.buy=parseInt(document.getElementById('ef-buy').value.replace(/,/g,''))||m.buy;
  m.qty=parseInt(document.getElementById('ef-qty').value.replace(/,/g,''))||null;
  m.total=m.buy&&m.qty?m.buy*m.qty:null;
  m.target=parseInt(document.getElementById('ef-target').value.replace(/,/g,''))||null;
  m.stop=parseInt(document.getElementById('ef-stop').value.replace(/,/g,''))||null;
  m.days=document.getElementById('ef-days').value||null;
  m.memo=document.getElementById('ef-memo').value.trim();
  // 매도 정보
  var newSellPrice=parseInt((document.getElementById('ef-sellprice').value||'').replace(/,/g,''))||null;
  var newSellDate=document.getElementById('ef-selldate').value||null;
  m.sellPrice=newSellPrice||null;
  m.sellDate=newSellDate||null;
  m.sellTotal=newSellPrice&&m.qty?newSellPrice*m.qty:null;
  if(m.sellPrice) m.status='closed';
  persist();renderList();showDetail(id);
}

function toggleStat(id){const m=memos.find(m=>m.id===id);if(m){m.status=m.status==='active'?'closed':'active';persist();updateBadge();renderList();document.getElementById('detail-area').innerHTML='';}}
function delMemo(id){if(!confirm('삭제할까요?'))return;memos=memos.filter(m=>m.id!==id);persist();updateBadge();renderList();document.getElementById('detail-area').innerHTML='';}

function showInstallHint(){
  if(localStorage.getItem('install_hint_shown'))return;
  const ua=navigator.userAgent;
  const hint=document.getElementById('install-hint');
  const body=document.getElementById('install-hint-body');
  if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone)return;
  if(/iPad|iPhone|iPod/.test(ua)&&!window.MSStream){
    body.innerHTML='Safari에서 하단 <b>공유(□↑)</b> → <b>"홈 화면에 추가"</b>';
    hint.style.display='block';localStorage.setItem('install_hint_shown','1');
  }else if(/Android/.test(ua)){
    body.innerHTML='Chrome에서 우측 상단 <b>메뉴(⋮)</b> → <b>"홈 화면에 추가"</b>';
    hint.style.display='block';localStorage.setItem('install_hint_shown','1');
  }
}

load();upPrev();
</script>
